# https://github.com/marketplace/actions/publish-nuget
name: Publish JsonSchema.Net.Generation
on:
  push:
    branches:
      - master # Default release branch
    paths:
      - .github/workflows/publish-schema-gen.yml
      - src/JsonSchema.Generation/**
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write # required for nuget.org trusted publishing

jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      # Exchange a GitHub OIDC token for a short-lived nuget.org API key
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      # Publish
      - name: publish schema generation
        id: publish_schema_generation
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          PROJECT_FILE_PATH: src/JsonSchema.Generation/JsonSchema.Generation.csproj
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          INCLUDE_SYMBOLS: true
          TAG_FORMAT: schema-gen-v*
          PACKAGE_NAME: JsonSchema.Net.Generation
      - name: archive packages
        uses: actions/upload-artifact@v4
        with:
          name: archive-packages
          path: |
            **/*.nupkg
            **/*.snupkg
